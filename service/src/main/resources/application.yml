spring:
  application:
    name: book-service
  datasource:
    driver-class-name: org.h2.Driver
#    driver-class-name: org.postgresql.Driver
#    url: jdbc:postgresql://localhost/booksdb
#    username: postgres
#    password: changeme
    hikari:
      # Minimum number of idle connections waiting in the pool
      minimum-idle: 2
      # Maximum number of active connections the pool will keep
      maximum-pool-size: 5
  jpa:
#    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
#    show-sql: true

    properties:
# Fetches 100 rows at a time (a safe, balanced default)
      hibernate.jdbc.fetch_size: 100
      # Tells Hibernate not to waste performance checking autocommit status
#      hibernate.connection.provider_disables_autocommit: true

      hibernate.show_sql: true
      hibernate.format_sql: true
      hibernate.use_sql_comments: true
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled : true
    locations:
     - classpath:db/migration/{vendor}
  main:
    banner-mode: off

logging:
  level:
    root: info
    com.ashu.practice: debug
    com.hazelcast.system.logo: OFF

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

hazelcast:
  instance-name: book-service-instance
  map-name: book-service
  cluster-name: book-service


client:
  auth-service-url: http://localhost:8085/api/auth

security:
  paths:
    permitted:
      - /static/**
      - /error